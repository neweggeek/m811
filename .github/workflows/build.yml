name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: m811-windows
          path: target/release/m811.exe
      # Push a tag like v0.1.0 to publish m811.exe as a GitHub release.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} target/release/m811.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
